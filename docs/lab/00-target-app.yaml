apiVersion: v1
kind: Namespace
metadata:
  name: calico-plumber-lab
  labels:
    app.kubernetes.io/part-of: calico-plumber-lab
---
# Target Backend HTTP Server (port 8080)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-backend
  namespace: calico-plumber-lab
  labels:
    app: lab-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab-backend
  template:
    metadata:
      labels:
        app: lab-backend
        tier: backend
    spec:
      containers:
        - name: backend
          image: python:3.12-alpine
          command:
            - python3
            - -c
            - |
              import json, os, time
              from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

              class Handler(BaseHTTPRequestHandler):
                  def do_GET(self):
                      body = json.dumps({
                          "service": "lab-backend",
                          "pod": os.getenv("POD_NAME", ""),
                          "node": os.getenv("NODE_NAME", ""),
                          "path": self.path,
                          "ts": round(time.time(), 3),
                          "status": "ok",
                      }).encode()
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                  def log_message(self, fmt, *args):
                      pass

              ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: lab-backend
  namespace: calico-plumber-lab
  labels:
    app: lab-backend
spec:
  selector:
    app: lab-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
# Traffic Generator Client pinned to a DIFFERENT node from lab-backend (cross-node Calico path)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-client
  namespace: calico-plumber-lab
  labels:
    app: lab-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab-client
  template:
    metadata:
      labels:
        app: lab-client
        tier: frontend
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: lab-backend
                topologyKey: kubernetes.io/hostname
      containers:
        - name: client
          image: python:3.12-alpine
          command:
            - python3
            - -u
            - -c
            - |
              import time, urllib.request
              url = "http://lab-backend.calico-plumber-lab.svc.cluster.local:8080/api/ping"
              while True:
                  t0 = time.monotonic()
                  try:
                      with urllib.request.urlopen(url, timeout=2.5) as resp:
                          resp.read()
                          ms = (time.monotonic() - t0) * 1000
                          print(f"[OK] {resp.status} {ms:.1f}ms")
                  except Exception as e:
                      ms = (time.monotonic() - t0) * 1000
                      print(f"[ERR] {ms:.1f}ms {e}")
                  time.sleep(0.4)
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
