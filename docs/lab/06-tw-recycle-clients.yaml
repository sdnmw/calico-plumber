# Experiment 6: Reproducing Linux tcp_tw_recycle=1 + Calico natOutgoing (SNAT) PAWS SYN Drop
# Multiple Pods + a hostNetwork (Node) client on the SAME worker node access an external
# legacy CentOS 7 (Linux 3.10) Web Server (192.168.118.80:18080) with net.ipv4.tcp_tw_recycle=1.
#
# Replace EXTERNAL_WEB_URL with your legacy Linux (<4.12) Web server IP:Port.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-ext-pod
  namespace: calico-plumber-lab
  labels:
    app: lab-ext-pod
spec:
  replicas: 5
  selector:
    matchLabels:
      app: lab-ext-pod
  template:
    metadata:
      labels:
        app: lab-ext-pod
    spec:
      # Co-locate all test Pods on the same worker node so they share ONE Calico SNAT Node IP
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: lab-backend
              topologyKey: kubernetes.io/hostname
      containers:
        - name: client
          image: python:3.12-alpine
          env:
            - name: TARGET_URL
              value: "http://192.168.118.80:18080/ping"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          command:
            - python3
            - -u
            - -c
            - |
              import os, time, urllib.request
              url = os.environ["TARGET_URL"]
              me = f"{os.environ['POD_NAME']} ({os.environ['POD_IP']})"
              ok = err = 0
              while True:
                  t0 = time.monotonic()
                  try:
                      req = urllib.request.Request(url, headers={"Connection": "close"})
                      with urllib.request.urlopen(req, timeout=2.0) as resp:
                          resp.read()
                          ok += 1
                          ms = (time.monotonic() - t0) * 1000
                          print(f"[OK #{ok}] {me} -> {resp.status} {ms:.1f}ms")
                  except Exception as e:
                      err += 1
                      ms = (time.monotonic() - t0) * 1000
                      print(f"[FAIL #{err}] {me} -> {ms:.1f}ms {e}")
                  time.sleep(0.5)
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
# Node-level (hostNetwork) client on the SAME worker node sharing the exact Node IP with Calico SNAT
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-ext-node
  namespace: calico-plumber-lab
  labels:
    app: lab-ext-node
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab-ext-node
  template:
    metadata:
      labels:
        app: lab-ext-node
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: lab-backend
              topologyKey: kubernetes.io/hostname
      containers:
        - name: node-client
          image: python:3.12-alpine
          env:
            - name: TARGET_URL
              value: "http://192.168.118.80:18080/ping"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          command:
            - python3
            - -u
            - -c
            - |
              import os, time, urllib.request
              url = os.environ["TARGET_URL"]
              me = f"NODE {os.environ['NODE_NAME']} ({os.environ['POD_IP']})"
              ok = err = 0
              while True:
                  t0 = time.monotonic()
                  try:
                      req = urllib.request.Request(url, headers={"Connection": "close"})
                      with urllib.request.urlopen(req, timeout=2.0) as resp:
                          resp.read()
                          ok += 1
                          ms = (time.monotonic() - t0) * 1000
                          print(f"[OK #{ok}] {me} -> {resp.status} {ms:.1f}ms")
                  except Exception as e:
                      err += 1
                      ms = (time.monotonic() - t0) * 1000
                      print(f"[FAIL #{err}] {me} -> {ms:.1f}ms {e}")
                  time.sleep(0.8)
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 64Mi
